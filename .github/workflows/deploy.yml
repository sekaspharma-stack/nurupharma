name: Deploy PharmaSys to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          rm -rf site
          mkdir -p site
          cp index.html site/index.html
          cp 404.html site/404.html
          cp favicon.svg site/favicon.svg
          cp icon-192.png site/icon-192.png
          cp icon-512.png site/icon-512.png
          cp manifest.webmanifest site/manifest.webmanifest
          cp sw.js site/sw.js
          cp public/schema.sql site/schema.sql
      - name: Verify PWA files
        run: |
          test -s site/index.html
          test -s site/manifest.webmanifest
          test -s site/sw.js
          test -s site/404.html
          test -s site/icon-192.png
          test -s site/icon-512.png
          python - <<'PY'
          import json
          json.load(open('site/manifest.webmanifest',encoding='utf-8'))
          print('PWA files OK')
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
